name: formatting
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  merge_group:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    # Fork pull requests receive a read-only GITHUB_TOKEN, so they cannot
    # safely create a formatting pull request. The ordinary CI still runs.
    if: github.event_name == 'merge_group' || github.event.action == 'closed' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event.action != 'closed'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event.action != 'closed'
        with:
          node-version-file: package.json
          cache: npm
      - uses: flatt-security/setup-takumi-guard-golang@1c8aa7498f7f635fbd6ad6a0f436d03092b3502d # v1.1.0
        if: github.event.action != 'closed'
      - uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1
        if: github.event.action != 'closed'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: github.event.action != 'closed'
        with:
          version-file: .tool-versions
          install-only: true
      - run: golangci-lint fmt
        if: github.event.action != 'closed'
      - name: Update README
        if: github.event.action != 'closed'
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          for name in README README.ja
          do
            # shellcheck disable=SC2016
            envsubst '$GO_VERSION' < "$name.template.md" > "$name.md"
          done
      - run: npm install
        if: github.event.action != 'closed'
      - run: npx prettier --write .
        if: github.event.action != 'closed'
      - uses: dev-hato/actions-diff-pr-management@571be0d9572aaf77cdd315c12d6e73a1112910d7 # v2.2.6
        if: success() || failure()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name-prefix: chore/format
          pr-title-prefix: "chore: apply formatting and sync README"
          pr-description-prefix: "Automated formatting changes produced by golangci-lint fmt, prettier, and README/README.ja regenerated from their templates."
          exit-failure: false
