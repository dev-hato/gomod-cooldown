---
#################################
#################################
## Super Linter GitHub Actions ##
#################################
#################################
name: Lint Code Base
#
# Documentation:
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
#

#############################
# Start the job on all push #
#############################
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write
###############
# Set the Job #
###############
jobs:
  build:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest
    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full git history is needed to get a proper list
          # of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: package.json
      - uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1
      - run: bash "${GITHUB_WORKSPACE}/scripts/pr_test/pr_super_lint/npm_ci.sh"
      ################################
      # Run Linter against code base #
      ################################
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          LINTER_RULES_PATH: .
          # golangci-lint (invoked by super-linter) passes individually changed files to `golangci-lint run`,
          # which fails with "named files must all be in one directory"
          # whenever changed Go files span more than one directory.
          # This is an upstream limitation with no fix planned (super-linter/super-linter#6294).
          # Go is already linted properly (with `./...`) by the dedicated `lint` job in ci.yml, so skip it here.
          VALIDATE_GO: false
          # VALIDATE_GO_MODULES runs golangci-lint against every directory containing a go.mod,
          # including internal/cli/testdata/large-modules/* (go.mod/go.sum-only fixtures with no .go files)
          # and the repo root (whose code lives in subpackages, not the root package),
          # both of which fail with "no go files to analyze".
          # go vet/go test already cover module correctness in ci.yml, so skip this too.
          VALIDATE_GO_MODULES: false
          VALIDATE_BIOME_FORMAT: false
          # jscpd flags expected duplication this repo can't avoid:
          # README.md/README.ja.md are intentionally generated verbatim from README.template.md/README.ja.template.md,
          # CI jobs repeat the same checkout/setup-go/setup-takumi-guard-golang steps,
          # and table-driven Go tests share httptest boilerplate by convention.
          # golangci-lint's dupl linter already covers Go duplication under this project's own policy (.golangci.yml),
          # so skip jscpd entirely.
          VALIDATE_JSCPD: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
