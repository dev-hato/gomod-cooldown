version: "2"
run:
  tests: true
linters:
  default: all
  # Disabled linters either target dependencies not used by this project or
  # require a project-specific policy that this small CLI intentionally has not
  # adopted. All other golangci-lint v2 linters remain enabled.
  disable:
    - arangolint
    - clickhouselint
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - ginkgolinter
    - gochecknoglobals
    - gocognit
    - goheader
    - gomodguard
    - gomodguard_v2
    - importas
    - ireturn
    - lll
    - loggercheck
    - mnd
    - musttag
    - nlreturn
    - noinlineerr
    - prealloc
    - promlinter
    - protogetter
    - sloglint
    - spancheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testifylint
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
    - zerologlint
  settings:
    paralleltest:
      # Process and environment tests must remain free to run serially.
      ignore-missing: true
      # Cleanup must wait for any parallel subtests to finish.
      check-cleanup: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - gosec
          - noctx
          - revive
          - usestdlibvars
formatters:
  enable:
    - gofmt
    - goimports
