name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ env.VERSIONS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stable
        id: stable
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - run: echo "MOD_VERSION=$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_ENV"
      - run: echo "OLDEST_VERSION=$(printf '%s\n%s\n' "${MOD_VERSION}" "${{ steps.stable.outputs.go-version }}" | sort -V | head -n1)" >> "$GITHUB_ENV"
      - if: ${{ env.OLDEST_VERSION == env.MOD_VERSION && steps.stable.outputs.go-version != env.MOD_VERSION }}
        run: echo "VERSIONS=[\"${MOD_VERSION}\", \"stable\"]" >> "$GITHUB_ENV"
      - if: ${{ env.OLDEST_VERSION == steps.stable.outputs.go-version }}
        run: echo "VERSIONS=[\"${MOD_VERSION}\"]" >> "$GITHUB_ENV"
  unit:
    name: unit (Go ${{ matrix.go-version }})
    needs: go-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJson(needs.go-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go version
      - run: go test ./...
      - run: go vet ./...
  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
  platform:
    name: build/smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests on the target OS
        run: go test ./...
      - name: Build and smoke-test the CLI
        shell: bash
        run: |
          binary=./gomod-cooldown
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary=./gomod-cooldown.exe
          fi

          go build -trimpath -o "${binary}" ./cmd/gomod-cooldown
          "${binary}" --help
          "${binary}" --version
          "${binary}" -- go version
          go version -m "${binary}" | tee build-info.txt
          grep -F "github.com/dev-hato/gomod-cooldown/cmd/gomod-cooldown" build-info.txt
  vulnerability:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
  # Keep this stable check name: the main branch ruleset requires "test".
  test:
    name: test
    if: always()
    needs:
      - unit
      - race
      - platform
      - vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every test job to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
        run: |
          for result in \
            "${UNIT_RESULT}" \
            "${RACE_RESULT}" \
            "${PLATFORM_RESULT}" \
            "${VULNERABILITY_RESULT}"
          do
            if [[ "${result}" != "success" ]]; then
              echo "A required test job did not succeed: ${result}" >&2
              exit 1
            fi
          done
  # Keep this stable check name: the main branch ruleset requires "lint".
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
