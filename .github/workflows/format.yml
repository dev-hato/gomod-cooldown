name: Go formatting
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  merge_group:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    # Fork pull requests receive a read-only GITHUB_TOKEN, so they cannot
    # safely create a formatting pull request. The ordinary CI still runs.
    if: github.event_name == 'merge_group' || github.event.action == 'closed' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: github.event.action != 'closed'
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: github.event.action != 'closed'
        with:
          version: v2.12.2
          install-only: true
      - run: golangci-lint fmt
        if: github.event.action != 'closed'
      - uses: dev-hato/actions-diff-pr-management@571be0d9572aaf77cdd315c12d6e73a1112910d7 # v2.2.6
        if: success() || failure()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name-prefix: chore/gofmt
          pr-title-prefix: "chore: apply Go formatting"
          pr-description-prefix: "Automated formatting changes produced by golangci-lint fmt."
          exit-failure: false
